<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Калории — дневник питания</title>
<meta name="theme-color" content="#2b8a57">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Калории">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f0;--card:#fff;--ink:#1c2420;--muted:#6b756f;--line:#e2e7df;--accent:#2b8a57;--accent-soft:#e2f1e8;--p:#d4603f;--f:#d99a14;--c:#3a78cf;--danger:#c4402b;--water:#2794c4;--water-soft:#e1f1f8;}
@media (prefers-color-scheme:dark){:root{--bg:#111412;--card:#1a1f1c;--ink:#e8ede9;--muted:#97a29b;--line:#2a312d;--accent:#4cc283;--accent-soft:#1d3226;--p:#ec7d63;--f:#efbb45;--c:#6aa2ef;--danger:#ef6a55;--water:#4bb6e0;--water-soft:#16303b;}}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Manrope,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:18px 14px 60px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-.02em}
h1 span{color:var(--accent)}
.status{font-size:12px;color:var(--muted)}
.status.warn{color:var(--danger)}
nav.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px;position:sticky;top:8px;z-index:5}
nav.tabs button{flex:1;border:0;background:none;padding:10px 6px;border-radius:10px;font:inherit;font-weight:700;color:var(--muted);cursor:pointer}
nav.tabs button.on{background:var(--accent-soft);color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
h2{font-size:17px;margin:0 0 12px;font-weight:800}
h3{font-size:15px;margin:0;font-weight:800}
.muted{color:var(--muted)}
.small{font-size:12.5px}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:11px;padding:10px 16px;font-weight:700;background:var(--accent);color:#fff}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.wide{width:100%}
.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);width:40px;height:40px;border-radius:12px;font-size:20px;line-height:1}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.datebar .d{text-align:center;font-weight:700}
.datebar .d small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.summary{display:grid;grid-template-columns:132px 1fr;gap:18px;align-items:center}
.ring{position:relative;width:132px;height:132px}
.ring svg{transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .big{font-size:26px;font-weight:800;letter-spacing:-.02em}
.ring .lbl{font-size:11.5px;color:var(--muted)}
.ring.over .big{color:var(--danger)}
.kpis{display:flex;gap:14px;margin-bottom:12px;flex-wrap:wrap}
.kpis div{font-size:12.5px;color:var(--muted)}
.kpis b{display:block;font-size:17px;color:var(--ink)}
.bar{margin-bottom:9px}
.bar .t{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px}
.bar .t b{font-weight:700}
.bar .tr{height:8px;border-radius:6px;background:var(--line);overflow:hidden}
.bar .fl{height:100%;border-radius:6px}
.bar.over .t span{color:var(--danger)}
.water{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.glasses{display:flex;gap:5px;flex-wrap:wrap}
.glass{width:26px;height:32px;border-radius:4px 4px 8px 8px;border:2px solid var(--water);background:transparent;padding:0}
.glass.on{background:var(--water)}
.meal-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.item{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.item .n{font-weight:600}
.item .m{font-size:12px;color:var(--muted)}
.item .k{font-weight:700;white-space:nowrap}
.del{border:0;background:none;color:var(--muted);font-size:18px;padding:4px 6px;border-radius:8px}
.del:hover{color:var(--danger);background:var(--line)}
.addbtn{margin-top:8px;border:1px dashed var(--line);background:none;color:var(--accent);font-weight:700;border-radius:11px;padding:9px;width:100%}
.hint{background:var(--accent-soft);border-color:transparent;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:10px 12px;width:100%}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.field{margin-bottom:12px}
.seg{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 6px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.res div{background:var(--bg);border-radius:12px;padding:10px}
.res span{display:block;font-size:12px;color:var(--muted)}
.res b{font-size:18px}
.res .hl{background:var(--accent-soft)}
.res .hl b{color:var(--accent)}
.macro3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.macro3 div{border-radius:12px;padding:10px;background:var(--bg)}
.macro3 span{font-size:12px;color:var(--muted);display:block}
.macro3 b{font-size:18px}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}
.wlist .row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.chart svg{width:100%;height:auto;display:block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stats div{background:var(--bg);border-radius:12px;padding:10px}
.stats span{display:block;font-size:12px;color:var(--muted)}
.stats b{font-size:17px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);width:100%;max-width:720px;max-height:88vh;border-radius:20px 20px 0 0;padding:16px;display:flex;flex-direction:column}
@media (min-width:760px){.ov{align-items:center}.sheet{border-radius:20px;max-height:80vh}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.results{overflow:auto;margin-top:10px;flex:1;min-height:120px}
.food{display:flex;justify-content:space-between;gap:10px;padding:10px 8px;border-radius:10px;cursor:pointer;border:0;background:none;width:100%;text-align:left;color:var(--ink)}
.food:hover{background:var(--bg)}
.food small{color:var(--muted);display:block;font-size:12px}
.food .kc{font-weight:700;white-space:nowrap}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.quick button{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:6px 10px;font-weight:600;color:var(--ink)}
.preview{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.preview div{background:var(--bg);border-radius:10px;padding:8px;text-align:center}
.preview span{display:block;font-size:11.5px;color:var(--muted)}
.preview b{font-size:16px}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;padding:6px 0}
.tag{display:inline-block;font-size:10.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.item{cursor:pointer}
.mtools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.mtools .btn{padding:9px 10px}
.rhead{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:10px 8px 4px}
.food .kc{display:flex;align-items:center;gap:4px}
.amt{display:flex;gap:8px;align-items:center}
.amt input{font-size:20px;font-weight:700;flex:1;min-width:0}
.amt .seg{flex:0 0 auto}
.phwait{display:flex;gap:14px;align-items:center;padding:20px 0}
.phwait img,.phhead img{width:84px;height:84px;object-fit:cover;border-radius:12px;flex:0 0 auto}
.phhead{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.phrow{display:grid;grid-template-columns:auto 1fr 74px auto 52px;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.phrow input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.phn{font-weight:600}.phn small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.ph-g{padding:8px;text-align:right}
.phk{text-align:right}
.phtotal{text-align:right;margin:10px 0 12px}
.mtools{grid-template-columns:1fr 1fr 1fr}.mtools.two{grid-template-columns:1fr 1fr}
.bcreader{width:100%;border-radius:14px;overflow:hidden;background:#000;min-height:40px}
.bcreader video{border-radius:14px}
.recipe{cursor:pointer}
.rsum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rsum div{background:var(--bg);border-radius:10px;padding:8px;font-size:13px}
.rsum span{display:block;font-size:11.5px;color:var(--muted)}
.rsum b{font-size:16px}
.ringr{display:grid;grid-template-columns:1fr 74px auto 52px auto;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.ringr .n{font-weight:600}.ringr .m{font-size:12px;color:var(--muted)}
.r-g{padding:8px;text-align:right}.rk{text-align:right}
.rres{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rres div{background:var(--bg);border-radius:12px;padding:10px}
.rres .hl{background:var(--accent-soft)}
.rres span{display:block;font-size:12px;color:var(--muted)}
.rres b{font-size:18px;display:block}
.rres small{font-size:12px;color:var(--muted)}
@media (max-width:520px){.rres{grid-template-columns:1fr}.rsum{grid-template-columns:1fr 1fr 1fr}}
.onl-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 4px}.onl-btns.one{grid-template-columns:1fr}
.onl-wait{padding:10px 8px}
.aihint{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:12px;padding:12px;margin:10px 0}
.aihint .btn{flex:0 0 auto}
footer{font-size:12px;color:var(--muted);text-align:center;margin-top:20px}
@media (max-width:520px){.summary{grid-template-columns:1fr;justify-items:center}.summary .right{width:100%}.res{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr 1fr}}
</style>
</head>

const store={db:null,uid:null,cloud:false,readOnly:false,pending:{},busy:{},timers:{}};
let statusMsg='',statusWarn=false;
function setStatus(m,warn){statusMsg=m;statusWarn=!!warn;const el=$('#status');if(el){el.textContent=m;el.className='status'+(warn?' warn':'')}}
function lsGet(k){try{const v=localStorage.getItem('kcal:'+k);return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem('kcal:'+k,JSON.stringify(v))}catch(e){}}
function ref(k){return store.db.doc('data/users/'+store.uid+'/'+k)}
function withTimeout(p,ms){let t;return Promise.race([p,new Promise((_,rej)=>{t=setTimeout(()=>rej({code:'timeout'}),ms)})]).finally(()=>clearTimeout(t))}
async function load(k){
  const local=lsGet(k);
  if(!store.cloud) return local;
  try{
    const snap=await withTimeout(ref(k).get(),10000);
    if(snap.exists){const d=JSON.parse(JSON.stringify(snap.data()));lsSet(k,d);return d}
    if(local) save(k,local);
    return local;
  }catch(e){setStatus('Нет связи с облаком — показаны данные из этого браузера',true);return local}
}
function save(k,v){
  lsSet(k,v);
  if(!store.cloud||store.readOnly) return;
  store.pending[k]=JSON.parse(JSON.stringify(v));
  if(!store.busy[k]) flush(k);
}
function saveSoon(k,v){clearTimeout(store.timers[k]);lsSet(k,v);store.timers[k]=setTimeout(()=>save(k,v),600)}
async function flush(k){
  store.busy[k]=true;
  while(store.pending[k]){
    const data=store.pending[k]; delete store.pending[k];
    try{await ref(k).set(data)}
    catch(e){
      const code=e&&e.code;
      if(code==='unavailable'){await new Promise(r=>setTimeout(r,700+Math.random()*900));try{await ref(k).set(data)}catch(e2){setStatus('Не удалось сохранить в облако',true)}}
      else if(code==='invalid_argument'){store.readOnly=true;setStatus('Облако недоступно — данные хранятся в этом браузере',true)}
      else if(code==='quota_exceeded'){setStatus('Хранилище заполнено — удалите старые записи',true)}
      else setStatus('Не удалось сохранить в облако',true);
    }
  }
  store.busy[k]=false;
}

// ---------- Расчёты ----------
function calc(p){
  if(!p) return null;
  const w=+p.weight,h=+p.height,a=+p.age;
  if(!(w>0&&h>0&&a>0)) return null;
  const goal=p.goal||'keep';
  const bmr=10*w+6.25*h-5*a+(p.sex==='f'?-161:5);
  const tdee=bmr*actFactor(p);
  let kcal=tdee*(1+PACEV[goal][+(p.pace??1)]);
  const floor=p.sex==='f'?1200:1500; let clamped=false;
  if(goal==='lose'&&kcal<floor){kcal=floor;clamped=true}
  kcal=Math.round(kcal/10)*10;
  const bmi=w/((h/100)**2);
  const refW=bmi>30?25*(h/100)**2:w;           // при ожирении считаем белок от «нормального» веса
  const prot=Math.round({lose:2.0,keep:1.6,gain:1.8}[goal]*refW);
  const fat=Math.round(Math.max(0.8*refW,kcal*0.25/9));
  const carb=Math.max(0,Math.round((kcal-prot*4-fat*9)/4));
  return {bmr,tdee,kcal,prot,fat,carb,bmi,clamped,water:Math.round(w*30/250)*250,weekly:(kcal-tdee)*7/7700};
}
function bmiText(b){return b<18.5?'недостаток веса':b<25?'норма':b<30?'избыточный вес':'ожирение'}
function dayTotals(day){const t={k:0,p:0,f:0,c:0};for(const it of day.items){t.k+=it.k;t.p+=it.p;t.f+=it.f;t.c+=it.c}return t}
function curDay(){return S.days[S.date]||(S.days[S.date]=emptyDay())}

function render(){

}

function dateLabel(s){
  const d=parseYmd(s),t=today(),y=ymd(new Date(Date.now()-864e5));
  const main=s===t?'Сегодня':s===y?'Вчера':new Intl.DateTimeFormat('ru-RU',{weekday:'long'}).format(d);
  return {main:main.charAt(0).toUpperCase()+main.slice(1),sub:new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long',year:'numeric'}).format(d)};
}

function bar(label,val,goal,color){
  const pct=goal?Math.min(100,val/goal*100):0, over=goal&&val>goal*1.05;
  return `<div class="bar${over?' over':''}"><div class="t"><b>${label}</b><span>${r0(val)}${goal?' / '+goal:''} г</span></div><div class="tr"><div class="fl" style="width:${pct}%;background:${color}"></div></div></div>`;
}

    </svg><div class="in">${goal?`<div class="big">${nf(Math.abs(left))}</div><div class="lbl">${over?'ккал сверх нормы':'ккал осталось'}</div>`:`<div class="big">${nf(t.k)}</div><div class="lbl">ккал съедено</div>`}</div></div>

function vResults(){
  const c=calc(S.profile);
  if(!c) return `<div class="card muted">Заполните возраст, рост и вес — норма посчитается автоматически.</div>`;
  const p=S.profile;

  if(p.goal!=='keep'&&+p.target>0&&Math.abs(c.weekly)>0.01){
    const diff=+p.target-+p.weight, weeks=diff/c.weekly;
    if(weeks>0) eta=`До цели ${r1(Math.abs(diff))} кг — примерно ${Math.ceil(weeks)} нед. при соблюдении нормы.`;
  }
  return `<div class="card"><h2>Ваша норма</h2>
    <div class="res">
      <div class="hl"><span>Калории в день</span><b>${nf(c.kcal)}</b></div>

    </div>

      <div><span>Жиры</span><b style="color:var(--f)">${c.fat} г</b></div>

    </div>

    ${c.clamped?'<br><b>Норма поднята до безопасного минимума</b> — ниже есть слишком мало не стоит.':''}</div>

function vWeight(){
  const list=[...S.weights.list].sort((a,b)=>a.d<b.d?-1:1);

  let h=`<div class="card"><h2>Записать вес</h2><div class="grid2" style="align-items:end">

  if(list.length){
    const first=list[0].w,last=list[list.length-1].w,ch=last-first;

    for(const e of [...list].reverse()) h+=`<div class="row"><span>${new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long',year:'numeric'}).format(parseYmd(e.d))}</span><span><b>${r1(e.w).toLocaleString('ru-RU')} кг</b> <button class="del" data-act="wdel" data-d="${e.d}" aria-label="Удалить">×</button></span></div>`;
    h+=`</div>`;
  } else h+=`<div class="card muted">Записывайте вес раз в несколько дней, утром натощак — здесь появится график.</div>`;
  return h;
}

function chart(list,target){
  if(list.length<2) return `<div class="muted small">Нужно хотя бы две записи, чтобы построить график.</div>`;
  const W=640,H=230,L=44,Rr=14,T=14,B=30;
  const t0=parseYmd(list[0].d).getTime(),t1=parseYmd(list[list.length-1].d).getTime(),span=Math.max(1,t1-t0);
  let ys=list.map(e=>e.w); if(target) ys.push(target);
  let lo=Math.floor(Math.min(...ys)-1),hi=Math.ceil(Math.max(...ys)+1);
  const x=d=>L+(parseYmd(d).getTime()-t0)/span*(W-L-Rr), y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  let g='';
  const step=Math.max(1,Math.ceil((hi-lo)/4));
  for(let v=lo;v<=hi;v+=step) g+=`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`;
  if(target) g+=`<line x1="${L}" x2="${W-Rr}" y1="${y(target)}" y2="${y(target)}" stroke="var(--accent)" stroke-dasharray="5 5"/>`;
  const pts=list.map(e=>`${x(e.d).toFixed(1)},${y(e.w).toFixed(1)}`).join(' ');
  const fmt=d=>new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short'}).format(parseYmd(d));
  g+=`<polyline points="${pts}" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linejoin="round"/>`;
  g+=list.map(e=>`<circle cx="${x(e.d)}" cy="${y(e.w)}" r="3.5" fill="var(--card)" stroke="var(--ink)" stroke-width="2"><title>${fmt(e.d)}: ${e.w} кг</title></circle>`).join('');
  g+=`<text x="${L}" y="${H-8}" font-size="11" fill="var(--muted)">${fmt(list[0].d)}</text><text x="${W-Rr}" y="${H-8}" font-size="11" text-anchor="end" fill="var(--muted)">${fmt(list[list.length-1].d)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="График веса">${g}</svg>`;
}

function allFoods(){return [...S.custom.foods.map(f=>({...f,mine:true})),...BASE]}
function focusSoon(sel,select){setTimeout(()=>{const i=$(sel);if(i){i.focus();if(select&&i.select)i.select()}},40)}
function openAdd(meal,mode){M={mode:mode||'add',meal,step:'search',q:'',food:null,g:100,n:1,unit:'g',list:[]};renderModal();focusSoon('#m-q')}
function openEdit(id){
  const it=curDay().items.find(i=>i.id===id); if(!it) return;
  const per=x=>it.g?x/it.g*100:0;
  M={mode:'edit',id,meal:it.meal,step:'amount',food:{name:it.name,k:per(it.k),p:per(it.p),f:per(it.f),c:per(it.c),u:it.u||0,recipe:!!it.rec},g:r1(it.g),n:it.u?r1(it.g/it.u):1,unit:'g',list:[]};
  renderModal();focusSoon('#m-g',true);
}
function closeModal(){stopScanner();M=null;$('#modal').innerHTML=''}
function grams(){return M.unit==='pc'&&M.food.u?(+M.n||0)*M.food.u:(+M.g||0)}
function pickFood(f){M.food=f;M.g=100;M.n=1;M.unit=f.u?'pc':'g';M.step='amount';renderModal();focusSoon(M.unit==='pc'?'#m-n':'#m-g',true)}
function addRecent(f){
  const item={name:f.name,k:r1(f.k),p:r1(f.p),f:r1(f.f),c:r1(f.c),u:f.u||0};

}

function vSearch(){
  return `<input id="m-q" placeholder="Поиск: гречка, курица, банан…" value="${esc(M.q)}" autocomplete="off">
    <div class="mtools${M.mode==='recipe'?' two':''}"><button class="btn ghost" data-act="mbarcode">▥ Штрихкод</button>${M.mode!=='recipe'?'<button class="btn ghost" data-act="mphoto">📷 По фото</button>':''}<button class="btn ghost" data-act="mcustom">+ Свой</button></div>

}
function vResultsList(){
  const words=norm(M.q.trim()).split(/[\s,]+/).filter(Boolean).map(w=>w.length>=7?w.slice(0,-2):w.length>=5?w.slice(0,-1):w);
  const match=f=>{const n=norm(f.name);return words.every(w=>n.includes(w))};
  let html='';M.list=[];
  const row=(f,head)=>{const i=M.list.push(f)-1;return `<div class="food" data-act="pick" data-i="${i}" role="button" tabindex="0"><div>${esc(f.name)}${f.recipe?'<span class="tag">рецепт</span>':f.mine?'<span class="tag">мой</span>':''}<small>Б ${f.p} · Ж ${f.f} · У ${f.c}${f.u?` · 1 ${f.recipe?'порция':'шт'} ≈ ${f.u} г`:''}</small></div><div class="kc">${r0(f.k)} <span class="muted small">ккал</span>${f.mine?`<button class="del" data-act="cdel" data-id="${f.id}" aria-label="Удалить продукт">×</button>`:''}</div></div>`};
  if(!words.length&&S.recent.length){html+=`<div class="rhead">Недавние</div>`+S.recent.slice(0,8).map(f=>row(f)).join('')+`<div class="rhead">Все продукты</div>`}
  let list=allFoods().filter(match);
  if(words.length){const rank=f=>{const n=norm(f.name);return n.startsWith(words[0])?0:n.split(/[\s(«]+/).some(x=>x.startsWith(words[0]))?1:2};list=list.map((f,i)=>[rank(f),i,f]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]).map(x=>x[2])}
  list=list.slice(0,words.length?80:400);
  M.localCount=list.length;
  if(!list.length) html+=`<div class="muted small" style="padding:10px 8px 2px">В базе приложения «${esc(M.q.trim())}» нет.</div>`;
  else html+=list.map(f=>row(f)).join('');
  return html+(words.length?`<div id="m-online">${vOnline()}</div>`:'');
}

function vAmount(){
  const f=M.food, pc=M.unit==='pc'&&f.u;

    return `<div class="phhead">${M.img?`<img src="${M.img}" alt="">`:''}<div class="small muted">Оценка по фото примерная. Проверьте граммы — их можно поправить, остальное пересчитается.${M.comment?`<br>${esc(M.comment)}`:''}</div></div>
      <div class="results">${M.items.map((it,i)=>`<div class="phrow"><input type="checkbox" class="ph-on" data-i="${i}" ${it.on?'checked':''} aria-label="Добавить"><div class="phn">${esc(it.name)}<small>${r0(it.k)} ккал / 100 г</small></div><input class="ph-g" data-i="${i}" type="number" inputmode="decimal" value="${r0(it.g)}" aria-label="Граммы"><span class="small muted">г</span><b id="ph-k-${i}" class="phk">${r0(it.k*it.g/100)}</b></div>`).join('')}</div>
      <div class="phtotal">Итого: <b id="ph-total">${phTotal()}</b> ккал</div>
      <div class="grid2"><button class="btn ghost" data-act="mphoto">Другое фото</button><button class="btn" data-act="phadd">Добавить в ${esc((MEALS.find(m=>m[0]===M.meal)||['','дневник'])[1].toLowerCase())}</button></div>`;
  }
  return `<div class="small muted" style="margin-bottom:12px">Сфотографируйте тарелку сверху, чтобы была видна вся еда. ИИ определит продукты и примерный вес порций.</div>${vPhotoPick()}${back}`;

function vPhotoPick(){return `<div class="grid2"><label class="btn" style="text-align:center;cursor:pointer">📷 Сфотографировать<input id="ph-cam" type="file" accept="image/*" capture="environment" hidden></label><label class="btn ghost" style="text-align:center;cursor:pointer">Из галереи<input id="ph-gal" type="file" accept="image/*" hidden></label></div>`}
function phTotal(){return nf(M.items.filter(i=>i.on).reduce((s,i)=>s+i.k*i.g/100,0))}

function resizeImage(file,max){return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height)),w=Math.round(img.width*s),h=Math.round(img.height*s);
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.85))};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Не удалось открыть фото'))};img.src=url})}

const PHOTO_PROMPT=`Ты опытный диетолог. На фото еда. Определи каждое отдельное блюдо или продукт, оцени вес порции в граммах по размеру тарелки и посуды, и дай пищевую ценность НА 100 г для каждого.
Ответь ТОЛЬКО JSON без пояснений и без markdown, строго в формате:
{"items":[{"name":"название по-русски","grams":число,"kcal100":число,"p100":число,"f100":число,"c100":число}],"comment":"одно короткое замечание по-русски или пустая строка"}
Учитывай видимое масло, соусы и заправки. Если еды на фото нет — верни {"items":[],"comment":"…"}.`;

async function analyzePhoto(file){
  if(!M) return;
  M.step='photo';M.ph='loading';M.img=null;renderModal();
  try{
    const dataUrl=await resizeImage(file,1024);
    if(!M) return; M.img=dataUrl;renderModal();
    const text=await aiCall(PHOTO_PROMPT,dataUrl.split(',')[1],1500);
    const m=text.match(/\{[\s\S]*\}/); if(!m) throw new Error('Не удалось разобрать ответ. Попробуйте ещё раз.');
    const data=JSON.parse(m[0]);
    if(!M) return;
    M.items=(data.items||[]).map(x=>({name:String(x.name||'Блюдо').slice(0,80),g:Math.max(0,+x.grams||0),k:Math.max(0,+x.kcal100||0),p:Math.max(0,+x.p100||0),f:Math.max(0,+x.f100||0),c:Math.max(0,+x.c100||0),on:true}));
    M.comment=String(data.comment||'').slice(0,200);M.ph='result';
  }catch(e){
    if(!M) return;
    M.ph='error';M.err=e instanceof TypeError?'Нет связи с интернетом или сервис недоступен.':(e.message||'Что-то пошло не так.');
  }
  renderModal();
}
// ---------- Штрихкод ----------
const SCAN_LIB='https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
let scanner=null;
function loadScript(src){return new Promise((res,rej)=>{if(window.Html5Qrcode) return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>{s.remove();rej(new Error('Не удалось загрузить сканер — нужен интернет. Можно ввести цифры штрихкода вручную.'))};document.head.appendChild(s)})}
async function stopScanner(){const s=scanner;scanner=null;if(s){try{await s.stop()}catch(e){}try{s.clear()}catch(e){}}}
function bcMsg(t,bad){const el=$('#bc-msg');if(el){el.textContent=t;el.style.color=bad?'var(--danger)':'var(--muted)'}}
function cameraErr(e){const n=(e&&(e.name||''))+' '+String(e&&e.message||e||'');
  if(/NotAllowed|Permission/i.test(n)) return 'Нет доступа к камере. Разрешите камеру (Настройки → Safari → Камера) или введите цифры вручную.';
  if(/NotFound|no camera/i.test(n)) return 'Камера не найдена. Введите цифры штрихкода вручную.';
  return (e&&e.message&&!/^[A-Z]/.test(e.message)?e.message:'Камера недоступна. Введите цифры штрихкода вручную или распознайте с фото.')}
function vBarcode(){
  return `<div class="small muted" style="margin-bottom:10px">Наведите камеру на штрихкод на упаковке — продукт найдётся сам.</div>
    <div id="bc-reader" class="bcreader"></div>
    <div class="small" id="bc-msg" style="min-height:18px;margin:8px 0"></div>
    <div class="amt"><input id="bc-code" inputmode="numeric" placeholder="или введите цифры под штрихкодом" autocomplete="off"><button class="btn" data-act="bcfind">Найти</button></div>
    <label class="linkbtn" style="display:inline-block;cursor:pointer">Распознать штрихкод с фото<input id="bc-file" type="file" accept="image/*" hidden></label>
    <button class="btn ghost wide" data-act="mback" style="margin-top:8px">Назад к поиску</button>`;
}
function scanFormats(){const F=window.Html5QrcodeSupportedFormats;return F?[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128]:undefined}
async function startScanner(){
  try{
    bcMsg('Включаю камеру…');
    await loadScript(SCAN_LIB);
    if(!M||M.step!=='barcode') return;
    const sc=new Html5Qrcode('bc-reader',{formatsToSupport:scanFormats(),verbose:false,experimentalFeatures:{useBarCodeDetectorIfSupported:true}});
    scanner=sc;
    await sc.start({facingMode:'environment'},{fps:10,qrbox:(w,h)=>({width:Math.max(60,Math.floor(Math.min(320,w*0.85))),height:Math.max(60,Math.floor(Math.min(160,h*0.5)))})},code=>onBarcode(code),()=>{});
    if(!M||M.step!=='barcode'||scanner!==sc){try{await sc.stop()}catch(e){}return}
    bcMsg('');
  }catch(e){scanner=null;bcMsg(cameraErr(e),true)}
}
async function scanFromFile(file){
  await stopScanner();
  try{
    bcMsg('Ищу штрихкод на фото…');
    await loadScript(SCAN_LIB);
    const sc=new Html5Qrcode('bc-reader',{formatsToSupport:scanFormats(),verbose:false});
    const code=await sc.scanFile(file,false);
    try{sc.clear()}catch(e){}
    onBarcode(code);
  }catch(e){bcMsg(e&&e.message&&/интернет/.test(e.message)?e.message:'На фото не удалось найти штрихкод. Снимите ближе и ровнее или введите цифры.',true)}
}
async function onBarcode(code){
  if(!M||M.bcBusy) return;
  M.bcBusy=true;await stopScanner();
  try{if(navigator.vibrate) navigator.vibrate(60)}catch(e){}
  await lookupBarcode(code);
  if(M) M.bcBusy=false;
}
async function lookupBarcode(raw){
  const code=String(raw||'').replace(/\D/g,'');
  if(code.length<6){bcMsg('Проверьте цифры штрихкода.',true);return}
  const local=S.custom.foods.find(f=>f.barcode===code);
  if(local){pickFood({...local,mine:true});return}
  bcMsg('Штрихкод '+code+'. Ищу продукт в открытой базе…');
  try{
    const r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+code+'.json?fields=product_name,product_name_ru,product_name_uk,brands,nutriments');
    const j=await r.json();
    if(!M) return;
    const p=j&&j.product, n=(p&&p.nutriments)||{};
    let kcal=n['energy-kcal_100g'];
    if(kcal==null&&n['energy_100g']!=null) kcal=n['energy_100g']/4.184;
    const name=p&&(p.product_name_ru||p.product_name_uk||p.product_name||'').trim();
    if(!p||j.status!==1||kcal==null||isNaN(+kcal)){
      M.step='custom';M.q=name||'';M.bc=code;
      M.bcNote=name?`Нашёл «${name}», но без калорийности. Перепишите значения с упаковки — в следующий раз продукт найдётся по штрихкоду сам.`:'Этого продукта нет в открытой базе. Перепишите значения с упаковки — в следующий раз он найдётся по штрихкоду сам.';
      renderModal();focusSoon(name?'#c-k':'#c-n');return;
    }
    const brand=p.brands?p.brands.split(',')[0].trim():'';
    const food={id:'u'+uid(),name:(name||'Продукт')+(brand&&!(name||'').toLowerCase().includes(brand.toLowerCase())?' ('+brand+')':''),
      k:r1(+kcal),p:r1(+n.proteins_100g||0),f:r1(+n.fat_100g||0),c:r1(+n.carbohydrates_100g||0),u:0,barcode:code,src:'off'};
    S.custom.foods.unshift(food);save('custom',S.custom);
    pickFood({...food,mine:true});
  }catch(e){bcMsg('Нет связи с интернетом. Добавьте продукт вручную через «+ Свой продукт».',true)}
}

// ---------- Рецепты ----------
let R=null; // рецепт, который сейчас редактируется
function recipeCalc(r){
  const t={k:0,p:0,f:0,c:0,raw:0};
  for(const i of r.ings){const m=(+i.g||0)/100;t.k+=i.k*m;t.p+=i.p*m;t.f+=i.f*m;t.c+=i.c*m;t.raw+=(+i.g||0)}
  const cooked=+r.cooked>0?+r.cooked:t.raw, portions=Math.max(1,+r.portions||1);
  const per=x=>cooked?x/cooked*100:0;
  return {...t,cooked,portions,portionW:cooked/portions,k100:per(t.k),p100:per(t.p),f100:per(t.f),c100:per(t.c)};
}
function vRecipes(){
  if(R) return vRecipeEdit();
  const list=S.recipes.list;
  let h=`<div class="card"><h2>Рецепты</h2><div class="small muted" style="margin-bottom:12px">Готовите сразу на несколько раз? Внесите все ингредиенты и вес готового блюда — приложение посчитает калории и БЖУ всего блюда, на 100 г и на одну порцию. Рецепт появится в поиске продуктов: добавляйте его в дневник порциями или граммами.</div>
    <button class="btn wide" data-act="rnew">+ Новый рецепт</button></div>`;
  if(S.recipeMsg){h+=`<div class="card hint"><div>${esc(S.recipeMsg)}</div></div>`;S.recipeMsg=''}
  for(const r of list){const c=recipeCalc(r);
    h+=`<div class="card recipe" data-act="redit" data-id="${r.id}" role="button" tabindex="0"><div class="meal-h"><h3>${esc(r.name)}</h3><span class="small muted">${c.portions} порц. · ${nf(c.cooked)} г</span></div>
      <div class="rsum"><div><span>Всё блюдо</span><b>${nf(c.k)}</b> ккал</div><div><span>На 100 г</span><b>${nf(c.k100)}</b> ккал</div><div><span>1 порция · ${nf(c.portionW)} г</span><b>${nf(c.k/c.portions)}</b> ккал</div></div></div>`}
  return h;
}
function vRecipeEdit(){
  const rows=R.ings.map((i,n)=>`<div class="ringr"><div><div class="n">${esc(i.name)}</div><div class="m">${r0(i.k)} ккал / 100 г</div></div><input class="r-g" data-i="${n}" type="number" inputmode="decimal" value="${r1(i.g)}" aria-label="Граммы"><span class="small muted">г</span><b id="r-k-${n}" class="rk">${nf(i.k*(+i.g||0)/100)}</b><button class="del" data-act="rdel" data-i="${n}" aria-label="Убрать">×</button></div>`).join('');
  const raw=R.ings.reduce((s,i)=>s+(+i.g||0),0);
  return `<div class="card"><h2>${R.id?'Редактировать рецепт':'Новый рецепт'}</h2>
    <div class="field"><label class="f" for="r-name">Название</label><input id="r-name" value="${esc(R.name)}" placeholder="например, Фунчоза с курицей и овощами"></div>
    <label class="f">Ингредиенты</label>
    <div class="small muted" style="margin-bottom:4px">Вносите в том виде, в каком взвешивали: крупы и лапшу — сухими, мясо — сырым.</div>
    ${rows||'<div class="muted small" style="padding:10px 0">Пока пусто — добавьте первый ингредиент.</div>'}
    <button class="addbtn" data-act="ring">+ Добавить ингредиент</button></div>
  <div class="card"><div class="grid2">
    <div><label class="f" for="r-cooked">Вес готового блюда, г</label><input id="r-cooked" type="number" inputmode="decimal" value="${R.cooked||''}" placeholder="без него: ${nf(raw)} г"></div>
    <div><label class="f" for="r-port">На сколько порций</label><input id="r-port" type="number" inputmode="numeric" min="1" value="${R.portions||''}" placeholder="1"></div></div>
    <div class="note">Как узнать вес готового блюда: взвесьте кастрюлю с едой и вычтите вес пустой кастрюли. При варке вес меняется (фунчоза и крупы впитывают воду, мясо ужаривается), поэтому так калории на 100 г будут точными. Если не указать — посчитаем по сумме ингредиентов.</div></div>
  <div class="card" id="r-res">${vRecipeRes()}</div>
  <div class="small" id="r-err" style="color:var(--danger);min-height:18px;margin-bottom:6px"></div>
  <div class="grid2"><button class="btn ghost" data-act="rcancel">Отмена</button><button class="btn" data-act="rsave">Сохранить рецепт</button></div>
  ${R.id?'<button class="linkbtn" data-act="rremove" style="color:var(--danger);margin-top:10px">Удалить рецепт</button>':''}`;
}
function vRecipeRes(){
  const c=recipeCalc(R);
  if(!R.ings.length) return `<div class="muted small">Здесь появится расчёт.</div>`;
  const block=(t,w,k,p,f,cc,hl)=>`<div class="${hl?'hl':''}"><span>${t}${w?' · '+nf(w)+' г':''}</span><b>${nf(k)} ккал</b><small>Б ${r1(p)} · Ж ${r1(f)} · У ${r1(cc)}</small></div>`;
  return `<h2>Расчёт</h2><div class="rres">
    ${block('Всё блюдо',c.cooked,c.k,c.p,c.f,c.c)}
    ${block('На 100 г',0,c.k100,c.p100,c.f100,c.c100,true)}
    ${block(c.portions>1?'1 порция из '+c.portions:'1 порция',c.portionW,c.k/c.portions,c.p/c.portions,c.f/c.portions,c.c/c.portions)}
  </div>`;
}
function saveRecipe(){
  const err=t=>{$('#r-err').textContent=t};
  R.name=$('#r-name').value.trim();
  if(!R.name) return err('Укажите название рецепта.');
  if(!R.ings.length) return err('Добавьте хотя бы один ингредиент.');
  const c=recipeCalc(R);
  if(!(c.cooked>0)) return err('Укажите граммы ингредиентов.');
  const food={id:R.foodId||('u'+uid()),name:R.name,k:r1(c.k100),p:r1(c.p100),f:r1(c.f100),c:r1(c.c100),u:Math.round(c.portionW),recipe:true};
  R.foodId=food.id;
  const fi=S.custom.foods.findIndex(f=>f.id===food.id);
  if(fi>=0) S.custom.foods[fi]=food; else S.custom.foods.unshift(food);
  save('custom',S.custom);

  save('recipes',S.recipes);
  S.recipeMsg=`«${R.name}» сохранён: ${nf(c.k100)} ккал на 100 г, порция ${nf(c.portionW)} г — ${nf(c.k/c.portions)} ккал. Найдите его в дневнике через «+ Добавить продукт».`;

function updOnline(){const el=$('#m-online');if(el)el.innerHTML=vOnline()}

async function onlineSearch(q){
  if(!M) return;
  M.online={q,state:'loading',items:[]};updOnline();
  try{
    const url='https://world.openfoodfacts.org/cgi/search.pl?search_terms='+encodeURIComponent(q)+'&search_simple=1&action=process&json=1&page_size=50&fields=code,product_name,product_name_ru,product_name_uk,brands,nutriments';
    let j;try{j=await (await withTimeout(fetch(url),20000)).json()}catch(e1){await new Promise(r=>setTimeout(r,800));j=await (await withTimeout(fetch(url),20000)).json()}
    if(!M||!M.online||M.online.q!==q) return;
    const items=[],seen=new Set(),words=norm(q).split(/\s+/).filter(Boolean);
    for(const p of j.products||[]){
      const n=p.nutriments||{}; let k=n['energy-kcal_100g'];
      if(k==null&&n['energy_100g']!=null) k=n['energy_100g']/4.184;
      const name=(p.product_name_ru||p.product_name_uk||p.product_name||'').trim();
      if(!name||k==null||isNaN(+k)||+k<0||+k>950) continue;
      const brand=p.brands?String(p.brands).split(',')[0].trim():'';
      const full=name+(brand&&!norm(name).includes(norm(brand))?' ('+brand+')':'');
      if(seen.has(norm(full))) continue; seen.add(norm(full));
      items.push({name:full.slice(0,90),k:r1(+k),p:r1(+n.proteins_100g||0),f:r1(+n.fat_100g||0),c:r1(+n.carbohydrates_100g||0),u:0,barcode:p.code||'',src:'off',
        score:words.filter(w=>norm(full).includes(w)).length});
    }
    items.sort((a,b)=>b.score-a.score);
    M.online={q,state:'done',items:items.slice(0,15)};
  }catch(e){if(M&&M.online&&M.online.q===q) M.online={q,state:'error',items:[]}}
  updOnline();
}
async function askAI(q){
  if(!M) return;
  M.ai={q,state:'loading'};updOnline();
  try{
    const text=await aiCall(`Дай типичную пищевую ценность продукта или блюда «${q}» на 100 г, как в справочниках калорийности. Если название неоднозначное — выбери самый обычный вариант и уточни его в name. Ответь ТОЛЬКО JSON без пояснений: {"name":"уточнённое название по-русски","kcal100":число,"p100":число,"f100":число,"c100":число,"piece_g":вес одной штуки, ложки или обычной порции в граммах, или 0}`,null,400), m=text.match(/\{[\s\S]*\}/);
    if(!m) throw new Error('ИИ ответил непонятно. Попробуйте ещё раз.');
    const d=JSON.parse(m[0]);
    if(!M||!M.ai||M.ai.q!==q) return;
    M.ai={q,state:'done',item:{name:String(d.name||q).slice(0,90),k:r1(Math.max(0,+d.kcal100||0)),p:r1(Math.max(0,+d.p100||0)),f:r1(Math.max(0,+d.f100||0)),c:r1(Math.max(0,+d.c100||0)),u:Math.max(0,Math.round(+d.piece_g||0)),src:'ai'}};
  }catch(e){if(M&&M.ai&&M.ai.q===q) M.ai={q,state:'error',err:e instanceof TypeError?'Нет связи с интернетом.':(e.message||'Ошибка')}}
  updOnline();
}
function rememberFood(f){
  const ex=S.custom.foods.find(x=>norm(x.name)===norm(f.name)&&x.k===f.k);
  if(ex) return ex;

  if(f.barcode) food.barcode=f.barcode;
  S.custom.foods.unshift(food);save('custom',S.custom);return food;
}

// ---------- ИИ: Gemini (бесплатно) или Claude (платно) ----------
const GEM='https://generativelanguage.googleapis.com/v1beta/';
function aiProvider(){return S.settings.provider||(S.settings.key&&!S.settings.gkey?'claude':'gemini')}
function hasAI(){return aiProvider()==='gemini'?!!S.settings.gkey:!!S.settings.key}
function verNum(name){const m=name.match(/(\d+(?:\.\d+)?)/);return m?parseFloat(m[1]):0}
async function geminiModels(key){
  const r=await fetch(GEM+'models?pageSize=200&key='+encodeURIComponent(key));
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const msg=(j.error&&j.error.message)||'';throw new Error(/API key|API_KEY/i.test(msg)||r.status===400||r.status===403?'Ключ не подошёл. Скопируйте его из aistudio.google.com ещё раз.':'Google ответил ошибкой ('+r.status+').')}
  const ok=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent'))
    .map(m=>m.name.replace(/^models\//,''))
    .filter(n=>/^gemini/.test(n)&&/flash/.test(n)&&!/(image|tts|audio|live|embed|thinking|computer|robotics|native)/.test(n));
  const stable=n=>!/(preview|exp)/.test(n), lite=n=>/lite/.test(n);
  ok.sort((a,b)=>(stable(b)-stable(a))||(lite(a)-lite(b))||(verNum(b)-verNum(a))||(a.length-b.length));
  if(!ok.length) throw new Error('Не нашёл подходящих моделей Gemini для этого ключа.');
  return ok;
}
// prompt: текст; img: base64 JPEG или null. Возвращает текст ответа.
async function aiCall(prompt,img,maxTokens){
  if(aiProvider()==='gemini'){
    let models=S.settings.gmodels&&S.settings.gmodels.length?S.settings.gmodels:null;
    if(!models){models=await geminiModels(S.settings.gkey);S.settings.gmodels=models;S.settings.gmodel=models[0];saveSettings()}
    const order=[S.settings.gmodel||models[0],...models.filter(m=>m!==S.settings.gmodel)].slice(0,4);
    let lastErr=null;
    for(const model of order){
      const parts=[{text:prompt}]; if(img) parts.push({inline_data:{mime_type:'image/jpeg',data:img}});
      const r=await fetch(GEM+'models/'+model+':generateContent?key='+encodeURIComponent(S.settings.gkey),{method:'POST',headers:{'content-type':'application/json'},
        body:JSON.stringify({contents:[{role:'user',parts}],generationConfig:{temperature:0.2,maxOutputTokens:Math.max(maxTokens,2048),responseMimeType:'application/json'}})});
      const j=await r.json().catch(()=>({}));
      if(r.ok){
        const text=((j.candidates||[])[0]||{}).content?.parts?.map(p=>p.text||'').join('')||'';
        if(text){if(model!==S.settings.gmodel){S.settings.gmodel=model;saveSettings()}return text}
        lastErr=new Error('ИИ не ответил. Попробуйте ещё раз.');continue;
      }
      const msg=(j.error&&j.error.message)||'';
      if(r.status===400&&/API key|API_KEY/i.test(msg)||r.status===403) throw new Error('Ключ Gemini не подошёл — проверьте его во вкладке «Норма».');
      if(r.status===429){
        lastErr=new Error(/per.?day|PerDay|daily/i.test(msg)?'Бесплатный дневной лимит Gemini закончился — попробуйте завтра или добавьте продукт вручную.':'Слишком много запросов подряд — бесплатный лимит. Подождите минуту и попробуйте снова.');
        if(/limit: 0|free_tier/i.test(msg)) continue; // эта модель недоступна бесплатно — пробуем следующую
        throw lastErr;
      }
      if(r.status===404){lastErr=new Error('Модель недоступна.');continue}
      throw new Error(r.status>=500?'Сервис Google сейчас перегружен. Попробуйте через минуту.':'Ошибка Gemini ('+r.status+'). '+msg.slice(0,120));
    }
    throw lastErr||new Error('ИИ недоступен.');
  }
  const content=img?[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:img}},{type:'text',text:prompt}]:prompt;
  const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{
    'content-type':'application/json','x-api-key':S.settings.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:S.settings.model||'claude-haiku-5-5',max_tokens:maxTokens,messages:[{role:'user',content}]})});
  if(!res.ok){
    let msg='';try{msg=(await res.json()).error.message||''}catch(e){}
    if(res.status===401) throw new Error('Ключ Claude не подошёл. Проверьте его во вкладке «Норма».');
    if(/credit|balance/i.test(msg)) throw new Error('На балансе API Claude закончились деньги.');
    if(res.status===429||res.status===529||res.status>=500) throw new Error('Сервис сейчас перегружен. Попробуйте ещё раз через минуту.');
    throw new Error('Ошибка сервиса ('+res.status+'). '+msg);
  }
  const j=await res.json();return (j.content||[]).map(c=>c.text||'').join('');
}

    if(M.mode==='edit'){const it=day.items.find(i=>i.id===M.id);if(it){entry.rec=entry.rec||!!it.rec;Object.assign(it,entry)}}
    else{day.items.push({id:uid(),...entry});addRecent(f)}
    saveDay();closeModal();render();return;
  }
  if(a==='csave'){
    const num=id=>parseFloat(String($(id).value).replace(',','.'));
    const name=$('#c-n').value.trim(),k=num('#c-k'),p=num('#c-p')||0,f=num('#c-f')||0,c=num('#c-c')||0,u=num('#c-u')||0;
    if(!name||!(k>=0)){$('#c-err').textContent='Укажите название и калорийность.';return}
    const food={id:'u'+uid(),name,k:r1(k),p:r1(p),f:r1(f),c:r1(c),u:u>0?r1(u):0};if(M.bc) food.barcode=M.bc;
    S.custom.foods.unshift(food); save('custom',S.custom);
    pickFood(food);return;
  }
  if(a==='aiprov'){S.settings.provider=b.dataset.v;saveSettings();$('#ai-set').innerHTML=vAISettings();return}
  if(a==='skey'){
    S.settings.key=$('#s-key').value.trim();S.settings.model=$('#s-model').value;S.settings.provider='claude';saveSettings();
    const m=$('#s-msg');m.style.color='var(--accent)';m.textContent=S.settings.key?'Сохранено.':'Ключ удалён.';return;
  }
  if(a==='sgem'){
    const key=$('#s-gkey').value.trim(), msg=$('#s-msg'), sel=$('#s-gmodel');
    if(sel&&key===S.settings.gkey){S.settings.gmodel=sel.value;saveSettings()}
    if(!key){S.settings.gkey='';S.settings.gmodels=[];saveSettings();$('#ai-set').innerHTML=vAISettings();return}
    msg.style.color='var(--muted)';msg.textContent='Проверяю ключ…';
    (async()=>{try{
      const models=await geminiModels(key);
      const keep=key===S.settings.gkey&&models.includes(S.settings.gmodel)?S.settings.gmodel:models[0];
      Object.assign(S.settings,{provider:'gemini',gkey:key,gmodels:models,gmodel:keep});saveSettings();
      $('#ai-set').innerHTML=vAISettings();const m2=$('#s-msg');m2.style.color='var(--accent)';m2.textContent='Готово! ИИ подключён ('+keep+').';
    }catch(e){msg.style.color='var(--danger)';msg.textContent=e instanceof TypeError?'Нет связи с интернетом.':e.message}})();
    return;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(R&&t.classList.contains('r-g')){const it=R.ings[+t.dataset.i];it.g=parseFloat(t.value.replace(',','.'))||0;$('#r-k-'+t.dataset.i).textContent=nf(it.k*it.g/100);$('#r-res').innerHTML=vRecipeRes();return}
  if(R&&t.id==='r-cooked'){R.cooked=parseFloat(t.value.replace(',','.'))||'';$('#r-res').innerHTML=vRecipeRes();return}
  if(R&&t.id==='r-port'){R.portions=parseInt(t.value)||'';$('#r-res').innerHTML=vRecipeRes();return}
  if(R&&t.id==='r-name'){R.name=t.value;return}
  if(t.id==='m-q'){M.q=t.value;$('#m-res').innerHTML=vResultsList();
    clearTimeout(M.ot);const q=M.q.trim();
    if(M.localCount===0&&q.length>=3&&!(M.online&&M.online.q===q)) M.ot=setTimeout(()=>{if(M&&M.q.trim()===q){if(hasAI()&&!(M.ai&&M.ai.q===q)) askAI(q);onlineSearch(q)}},800);
    return}
  if(t.id==='m-g'){M.g=parseFloat(t.value.replace(',','.'))||0;$('#m-prev').innerHTML=vPrev();return}
  if(t.id==='m-n'){M.n=parseFloat(t.value.replace(',','.'))||0;$('#m-prev').innerHTML=vPrev();return}
  if(t.classList.contains('ph-g')){const it=M.items[+t.dataset.i];it.g=parseFloat(t.value.replace(',','.'))||0;$('#ph-k-'+t.dataset.i).textContent=r0(it.k*it.g/100);$('#ph-total').textContent=phTotal();return}
  if(t.classList.contains('ph-on')){M.items[+t.dataset.i].on=t.checked;$('#ph-total').textContent=phTotal();return}
  if(t.dataset.p){
    const v=t.tagName==='SELECT'?t.value:t.value.replace(',','.');
    setProfile(t.dataset.p,['daily','train','pace'].includes(t.dataset.p)?+v:v);
    $('#results').innerHTML=vResults();
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if((t.id==='ph-cam'||t.id==='ph-gal')&&t.files&&t.files[0]) analyzePhoto(t.files[0]);
  if(t.id==='bc-file'&&t.files&&t.files[0]){scanFromFile(t.files[0]);t.value=''}
});
document.addEventListener('keydown',e=>{
  if(!M) return;
  if(e.key==='Escape') closeModal();
  if(e.key==='Enter'){
    if(M.step==='barcode'&&e.target.id==='bc-code'){e.preventDefault();document.querySelector('[data-act="bcfind"]').click();return}
    if(M.step==='amount'){e.preventDefault();document.querySelector('[data-act="mok"]').click()}
    else if(M.step==='search'){const first=document.querySelector('#m-res .food');if(first){e.preventDefault();first.click()}}
  }
});
function saveSettings(){try{localStorage.setItem('kcalcfg',JSON.stringify(S.settings))}catch(e){}}

// ---------- Запуск ----------
async function init(){
  S.profile=lsGet('profile'); S.custom=lsGet('custom')||{foods:[]}; S.weights=lsGet('weights')||{list:[]};
  S.days[S.date]=lsGet('day-'+S.date)||emptyDay(); S.recent=lsGet('recent')||[]; S.recipes=lsGet('recipes')||{list:[]};
  try{S.settings=JSON.parse(localStorage.getItem('kcalcfg')||'{}')||{}}catch(e){S.settings={}}
  if(!S.profile) S.tab='profile';
  try{if(navigator.storage&&navigator.storage.persist) navigator.storage.persist()}catch(e){}
  render();
}
init();

// ---------- Резервная копия ----------
function exportBackup(){
  const data={app:'kcal',version:1,created:new Date().toISOString(),keys:{}};
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('kcal:')) data.keys[k]=localStorage.getItem(k)}}catch(e){}
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kalorii-backup-'+today()+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  setBackupMsg('Файл сохранён в «Загрузки».');
}
function setBackupMsg(t,bad){const el=$('#bk-msg');if(el){el.textContent=t;el.style.color=bad?'var(--danger)':'var(--accent)'}}
document.addEventListener('change',async e=>{
  if(e.target.id!=='bk-file'||!e.target.files[0]) return;
  try{
    const data=JSON.parse(await e.target.files[0].text());
    if(data.app!=='kcal'||!data.keys) throw 0;
    for(const [k,v] of Object.entries(data.keys)) if(k.startsWith('kcal:')) localStorage.setItem(k,v);
    S.days={};init();S.tab='profile';render();setBackupMsg('Данные восстановлены.');
  }catch(err){setBackupMsg('Это не файл резервной копии этого приложения.',true)}
  e.target.value='';
});

// ---------- Работа без интернета ----------
if('serviceWorker' in navigator && location.protocol==='https:'){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
